[databases]
tayssir_test = host=127.0.0.1 port=5433 dbname=tayssir_test

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6543
auth_type = trust
auth_file = /tmp/pgbtest/userlist.txt
; نمط المعاملة — نفس نمط Supavisor على 6543
pool_mode = transaction
max_client_conn = 200
; سعة صغيرة مقصودة: تجعل انتظار طابور المجمّع قابلاً للقياس
default_pool_size = 5
reserve_pool_size = 0
server_idle_timeout = 60
logfile = /tmp/pgbtest/pgbouncer.log
pidfile = /tmp/pgbtest/pgbouncer.pid
admin_users = postgres
stats_users = postgres
