name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # قيمة وهمية فقط (ليست سراً ولا تتصل بأي خدمة حقيقية) لتفادي فشل البناء
      # بسبب فحص وجود المتغير في src/lib/db.ts. الصفحات كلها ديناميكية
      # (force-dynamic) ولا تُنفَّذ أي استعلامات فعلية أثناء "next build".
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
