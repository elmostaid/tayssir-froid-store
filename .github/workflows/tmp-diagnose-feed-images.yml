name: tmp-diagnose-feed-images

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: TF-RF-024 image
        run: |
          URL="https://tayssir-froid-store-git-product-upda-4deb4c-elmostaids-projects.vercel.app/product-images/TF-RF-024/TF-RF-024-1.webp"
          echo "REQUEST_URL: $URL"
          curl -sS -L --max-time 30 -D /tmp/h1.txt -o /tmp/rf024.bin -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" -w "\nFINAL_URL:%{url_effective}\nHTTP_STATUS:%{http_code}\nSIZE_BYTES:%{size_download}\nCONTENT_TYPE_CURL:%{content_type}\n" "$URL"
          echo "--- headers ---"; cat /tmp/h1.txt
          echo "--- file(1) verdict ---"; file /tmp/rf024.bin
          echo "--- first 300 bytes as text (to spot HTML) ---"; head -c 300 /tmp/rf024.bin

      - name: TF-RF-023 image
        run: |
          URL="https://tayssir-froid-store-git-product-upda-4deb4c-elmostaids-projects.vercel.app/product-images/TF-RF-023/TF-RF-023-1.webp"
          echo "REQUEST_URL: $URL"
          curl -sS -L --max-time 30 -D /tmp/h2.txt -o /tmp/rf023.bin -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" -w "\nFINAL_URL:%{url_effective}\nHTTP_STATUS:%{http_code}\nSIZE_BYTES:%{size_download}\nCONTENT_TYPE_CURL:%{content_type}\n" "$URL"
          echo "--- headers ---"; cat /tmp/h2.txt
          echo "--- file(1) verdict ---"; file /tmp/rf023.bin
          echo "--- first 300 bytes as text (to spot HTML) ---"; head -c 300 /tmp/rf023.bin

      - name: TF-WM-031 image
        run: |
          URL="https://tayssir-froid-store-git-product-upda-4deb4c-elmostaids-projects.vercel.app/product-images/TF-WM-031/TF-WM-031-1.webp"
          echo "REQUEST_URL: $URL"
          curl -sS -L --max-time 30 -D /tmp/h3.txt -o /tmp/wm031.bin -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" -w "\nFINAL_URL:%{url_effective}\nHTTP_STATUS:%{http_code}\nSIZE_BYTES:%{size_download}\nCONTENT_TYPE_CURL:%{content_type}\n" "$URL"
          echo "--- headers ---"; cat /tmp/h3.txt
          echo "--- file(1) verdict ---"; file /tmp/wm031.bin
          echo "--- first 300 bytes as text (to spot HTML) ---"; head -c 300 /tmp/wm031.bin

      - name: feed/meta-catalog.csv
        run: |
          FEED="https://tayssir-froid-store-git-product-upda-4deb4c-elmostaids-projects.vercel.app/feed/meta-catalog.csv"
          echo "REQUEST_URL: $FEED"
          curl -sS -L --max-time 30 -D /tmp/h4.txt -o /tmp/feed.csv -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" -w "\nFINAL_URL:%{url_effective}\nHTTP_STATUS:%{http_code}\nSIZE_BYTES:%{size_download}\nCONTENT_TYPE_CURL:%{content_type}\n" "$FEED"
          echo "--- headers ---"; cat /tmp/h4.txt
          echo "--- first 300 bytes ---"; head -c 300 /tmp/feed.csv
          echo ""
          echo "--- TF-RF-023 row ---"; grep "^TF-RF-023," /tmp/feed.csv || echo "NOT FOUND"
          echo "--- TF-RF-024 row ---"; grep "^TF-RF-024," /tmp/feed.csv || echo "NOT FOUND"
          echo "--- total data rows ---"; tail -n +2 /tmp/feed.csv | grep -c "."

      - name: robots.txt
        run: |
          curl -sS -L --max-time 30 -D - -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "https://tayssir-froid-store-git-product-upda-4deb4c-elmostaids-projects.vercel.app/robots.txt"
